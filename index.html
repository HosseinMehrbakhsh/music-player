<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music player</title>

    <!-- bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="player_box shadow-lg d-flex flex-column align-items-center rounded-5 p-4">
            <div class="song_cover bg_gray_blue rounded-circle p-2 shadow">
                <img src="assets/imgs/man2.webp" class="song_cover_img rounded-circle" width="300px" alt="">
            </div>

            <div class="song_info d-flex flex-column align-items-center py-4">
                <span class="song_name fs-1 fw-semibold pb-2 "></span>
                <span class="singer_name fs-5"></span>
            </div>

            <div class=" w-100">
                <div class="song_progress progress bg_gray_blue">
                    <div class="song_progress_bar progress-bar " style="width: 0%;"></div>
                </div>
                <div class="song_time fs-5 d-flex justify-content-between ">
                    <span class="playing_time">0:00</span>
                    <span class="end_time"></span>
                </div>
            </div>

            <div class="song_control d-flex align-items-center fs-1 gap-4">
                <button class="previous_btn control_btn p-2 rounded-circle bg_gray_blue border-0 text-white"
                    onclick="previous()">
                    <i class="bi bi-skip-start"></i>
                </button>

                <button class="play_btn control_btn p-3 rounded-circle border-0 text-white">
                    <i class="bi bi-play"></i>
                </button>

                <button class="next_btn control_btn p-2 rounded-circle bg_gray_blue border-0 text-white"
                    onclick="next()">
                    <i class="bi bi-skip-end"></i>
                </button>
            </div>

            <div class="song_extra_control d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center w-25">
                    <div>
                        <i class="bi bi-volume-up icon_volum"></i>
                    </div>

                    <input class="volume w-75" type="range" min="0" max="100" value="80">
                </div>

                <div class="d-flex align-items-baseline gap-2">
                    <div class=" icon_rewind">
                        <i class="bi bi-rewind"></i>
                    </div>

                    <select name="" id="" class="song_speed form-select-sm">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="1.75">1.75x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>

</html>
